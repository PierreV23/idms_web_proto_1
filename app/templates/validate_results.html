<table class="table table-sm table-striped table-bordered">
    <thead>
        <tr>
            <td>Scope</td>
            <td>ID</td>
            <td>Level</td>
            <td>Message</td>
        </tr>
    </thead>
    <tbody>
    {% for item in data %}
        <tr>
            <td>{{ item[0] }}</td>
            <td>{{ item[1] }}</td>
            <td>{{ item[2] }}</td>
            <td>{{ item[3] }}</td>
        </tr>

    {% endfor %}
    </tbody>
</table>
