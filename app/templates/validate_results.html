<table class="table table-sm table-striped table-bordered">
    <thead>
        <tr>
            {% for column in data %}
            <td>{{ column }}</td>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
    {% for item in data['Description'] %}
        <tr>
            {% for column in data %}
            <td>{{ data[column][item] }}</td>
            {% endfor %}
        </tr>

    {% endfor %}
    </tbody>
</table>
