{% extends 'base2.html' %}
 
{% block heading %}
<H3><b>New NGS Run</b></H3>
{% endblock %}

{% block content %}


<div class="container">
    
<form action="new" method="post">
    <div class="form-group row">
        <label for="ngs_name" class="col-sm-1 col-form label">Name</label>
        <input type="text" class="form-control col-sm-2 input-sm" name="description" id="ngs_name" placeholder="Description" value="{{ data.description }}">
        <label for="ngs_flowcell" class="col-sm-1 col-form-label">Flowcell:</label>
        <input type="text" class="form-control col-sm-1" name="flowcell" id="ngs_flowcell" placeholder="Flowcell" value="{{ data.flowcell }}">
      </div>

<div class="form-group row">
    <label class="col-sm-1 col-form-label">Barcode</label>
    <label class="col-sm-1 col-form-label">Unilab ID</label>
    <label class="col-sm-1 col-form-label">Target</label>
    <label class="col-sm-1 col-form-label">Primer Set</label>
    <label class="col-sm-1 col-form-label">Description</label>
</div>

<div class="form-group row">
<label class="col-sm-1 col-form-label"></label>
<label class="col-sm-1 col-form-label"><button type="button" class="btn btn-secondary" id="databutton">Unilab Text List</button></label>
<label class="col-sm-1 col-form-label"><button type="button" class="btn btn-secondary" id="targetbutton">Copy down</button></label>
<label class="col-sm-1 col-form-label"><button type="button" class="btn btn-secondary" id="primerbutton">Copy down</button></label>
</div>

{% for barcode in barcodes %}
<div class="form-group form-row">
    <input readonly type="text" tabindex=-1 class="form-control col-sm-1" name="bar_{{ barcode }}" id="bar_{{ barcode }}" value="{{ barcode }}">
    <input type="text" class="form-control col-sm-1" tabindex={{ loop.index }} autocomplete="off" name="unilab_{{ barcode }}" id="unilab_{{ barcode }}" placeholder="Unilab ID" value="{{ data[barcode].unilab }}">
    <input type="text" class="form-control col-sm-1 targetAutocomplete targetfield" tabindex={{ loop.index + 24 }} autocomplete="off" name="target_{{ barcode }}" id="target_{{ barcode }}" placeholder="Target" value="{{ data[barcode].target }}">
    <input type="text" class="form-control col-sm-1 primerAutocomplete primerfield" tabindex={{ loop.index + 48 }} autocomplete="off" name="primer_{{ barcode }}" id="primer_{{ barcode }}" placeholder="Primer Set" value="{{ data[barcode].primer }}">
    <input type="text" class="form-control col-sm-1" tabindex={{ loop.index + 72 }} autocomplete="off" name="description_{{ barcode }}" id="description_{{ barcode }}" placeholder="Description" value="{{ data[barcode].description }}">
</div>
{% endfor %}
<button type="submit" class="btn btn-primary">Submit</button>
</form>

</div>


<script>
        $('#targetbutton').click(function () {
            $(".targetfield").val($("#target_barcode01").val());
        });
        $('#primerbutton').click(function () {
            $(".primerfield").val($("#primer_barcode01").val());
        });

        $('.targetAutocomplete').autoComplete({
            resolverSettings: {
                url: 'complete/virus_target'
            }
        });

        $('.primerAutocomplete').autoComplete({
            resolverSettings: {
                url: 'complete/primer_set'
            }
        });

</script>

{% endblock %}
