{% extends 'base.html' %}
  
{% block header %}
<h2>{% block title %}iRODS{% endblock %}</h2>
{% endblock %}

{% block content %}
<div class="card card-body">

<H3>Login to NGSweb</H3>

<form action="{{ url_for('auth.login') }}" method="post">
  <input type="hidden" name="next" id="next" value="{{ next }}"></input>
  {% if failed == True %}
  <div class="alert alert-danger" role="alert">
    Login to the web interface failed
  </div>
  {% endif %}
  <div class="form-group">
    <label for="environment">Environment</label>
    <select class="custom-select" name="environment" id="environment" >
    <option {% if debug == False %} selected {% endif %} value="Productie">Productie</option>
    <option value="Acceptatie">Acceptatie</option>
    <option {% if debug == True %} selected {% endif %} value="Test">Test</option>
    </select>
  </div>
  
  <div class="form-group">
    <label for="username">Username</label>
    <input type="text" class="form-control" name="username" id="username" placeholder="Username" {% if debug %} value="rods" {% endif %}></input>
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" class="form-control" name="password" id="password" placeholder="Password"  {% if debug %} value="12345" {% endif %}></input>
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>
  
</form>

</div>

{% endblock %}
