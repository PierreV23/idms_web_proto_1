{% extends 'base2.html' %}

  
{% block header %}
<h2>{% block title %}Upload data{% endblock %}</h2>
{% endblock %}

{% block content %}

<script>

var collection="{{ upload_data['collection'] }}"
var sortkey="";
var reverse="";

function load_list() {
    $.get("{{ url_for('collbrowser.collist') }}", {
      path: collection,
      sortkey: sortkey,
      reverse: reverse,
      new_path: false,
      btn_del: true,
      btn_download: false
    }, function(data) {
      $('#contents').html(data)
    });
    $.get("{{ url_for('upload.seq_list') }}", {
      collection: collection
    }, function(data) {
      $('#seqlist').html(data)
    });
  }

$('#contents').on('change', function() {
    alert('CHANGE');
});

$(document).on('collchange', function(e) {
  load_list();
});

$(window).on('load', function() {
  load_list();
});

</script>

<div class="container-wide">
    <div class="row">
        <div class="col">
            <center><h2>Upload data</h2><h4>(coll: {{ upload_data['collection'] }})</h4></center>
            <hr>
        </div>
    </div>
    <div class="row">
        <div class="col-md-3">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.7.1/min/dropzone.min.css">
            <form method="POST" action="{{ url_for('upload.upload_file') }}" class="dropzone" id="file-upload">
            <div id="contents" class="card coll-content-sm">

            </div>
            </form>
            <div class="card">
                <form>
                
                <div class="form-group">
                    <label for="example">Project</label>
                    <select class="custom-select" aria-label=".form-select-lg example">
                        <option selected>Select a project ...</option>
                        {% for project in projectlist %}
                        <option value="{{ project }}">{{ project }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" class="form-control" id="description">
                </div>
                <div class="form-group">
                    <label for="runid">RUN-ID</label>
                    <input type="text" class="form-control" id="runid">
                </div>
                <div class="form-group">
                    <button type="button" class="btn btn-primary">Confirm data upload</button>
                    <a href="{{ url_for('upload.cancel_upload') }}"><button type="button" class="btn btn-secondary">Cancel data upload</button></a>
                    <a href="{{ url_for('upload.validate') }}"><button type="button" class="btn btn-secondary">Verify data</button></a>
                </div>
            </form>   
        </div>  
        </div>
        <div class="col-md-9">
            <div class="card seqlist" id="seqlist"></div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.7.1/min/dropzone.min.js"></script>
<script type="text/javascript">

    Dropzone.options.fileUpload = {
        maxFilesize: 2000,
        parallelUpload: 8,
        createImageThumbnails: false,
        timeout: 120000,
        dictDefaultMessage: 'Drag files here or click to select',
        init: function() {
            this.on("success", function(file, response) {
                this.removeFile(file);
                load_list();
            });
        }
    }

</script>
{% endblock %}
