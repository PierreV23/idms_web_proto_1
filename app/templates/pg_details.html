<!-- PG_DETAILS
<BUTTON type="button" class="btn btn-primary" onClick='load_pgpage()'>RELOAD</BUTTON> -->
{{ message }}
<hr>
<div class="container-wide">
    <div class="row">
        <div class="col col-mb-4">
            Processes  <button type="button" class="btn btn-danger float-right" id="delete_process_button">Delete selected</button>
            <hr>
            <ul class="list-group">
                {% for process in pg_processes %}
                <li class="list-group-item select-process {% if process.name == selected_process %} active {% endif %}" data-process="{{ process.name }}">
                    {{ process.name }}
                </li>
                {% endfor %}
            </ul>


        </div>
        <div class="col col-mb-4">
            Settings
            <hr>
            <label>INPUT: {{ procinput }}</label>
            <button type="button" class="btn btn-primary" id="select_input_button">select</button>
            <hr>
            Dependencies
            <hr>
            <ul class="list-group">
            {% for dep in dependencies %}
            <li class="list-group-item">{{ dep.depends_on }}</li>
            {% endfor %}
            </ul>
            <hr>
            <BUTTON type="button" class="btn btn-primary" id="add_dep">Add dependency</BUTTON>            
        </div>
        <div class="col col-mb-4">
            Add process
            <hr>
            <form>
                <div class="form-group">
                    <label for="process_name">Process name (optional)</label>
                    <INPUT TYPE="text" class="form-control" id="process_name"></INPUT>
                </div>
                <div class="form-group">
                    <SELECT class="form-control" style="width: '100px'" id="process_select">
                        {% for proc in all_processes %}
                        <OPTION>{{ proc.name }}</OPTION>
                        {% endfor %}
                    </SELECT>
                </div>
                <BUTTON type="button" class="btn btn-primary" onClick='pgadd_process()''>Add Process</BUTTON>
            </form>
        </div>
    </div>
</div>

<script>

function pgadd_process() {
    $.get('{{ url_for("projects.pgaction") }}', {
        project: "{{ project }}",
        group: "{{ group }}",
        action: 'add_process',
        process: $("#process_select").val(),
        name: $('#process_name').val()
    }, function(data) {
        selected_process = data.selected_process;
        load_pgpage();
    });
    console.log('pg add process');
}

$('#delete_process_button').on('click', function(){
    console.log('delete selected')
    $.get('{{ url_for("projects.pgaction") }}', {
        project: "{{ project }}",
        group: "{{ group }}",
        action: 'delete_process',
        process: selected_process      
    }, function(data) {
        selected_process = null
        load_pgpage();
    });
})

$('#add_dep').on('click', function() {
    console.log('add dep')
    if (mode != 'add_dependency') {
        mode = 'add_dependency';
    } else {
        mode = 'display';
    }
        load_pgpage()
})
</script>
