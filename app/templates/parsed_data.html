<table class="table table-sm table-striped table-bordered">
    <thead>
        <tr>
            {% for column in data.columns %}
            <th>{{ column.title }}</th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for index in data.data.index %}
        <tr>
            {% for column in data.columns %}
            <td>{{ data.data[column.field][index] }}</td>
            {% endfor %}
        </tr>
        {% endfor %}
    </tbody>
</table >
