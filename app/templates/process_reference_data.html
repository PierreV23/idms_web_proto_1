<script src="{{ url_for('static', filename='js/bootstrap-table.min.js') }}"></script>
ReferenceData
<table class="table" id="refdata_table">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col" title="identifier in pipeline">Label</th>
        <th scope="col">ReferenceDataset</th>
        <th scope="col">Version</th>
        <th scope="col">Action</th>
      </tr>
      <tr class="table-primary">
          <td></td>
          <td width="200"><input id="refDataSetLabel" required pattern="[0-9a-zA-Z\-]+" placeholder="a_unique_label"></td>
          <td><select class="form-control form-control-sm invisible" id="refDataSetSelect">
              <option disabled selected value> -- select a reference dataset -- </option>
          </select></td>
          <td>    
            <select class="form-control form-control-sm disabled invisible" id="refDataSetVersionSelect">
          </select></td>
          <td><button class="btn-success disabled invisible" id="btnAddRefData"><i class="fas fa-plus-circle"></i></button></td>
      </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>

function addEventDeleteBtn(id) {
  document.getElementById('btn-delete-'+id).addEventListener('click', function() {
       $.get('{{ url_for("projects.process_del_referencedataversion") }}', { 
            referencedataid: id,
            processid: '{{ processid }}'
        }, function(data) {
            $('#refdata-row-'+id).remove()
        })
  });
}


function addEventChangeVersion(id) {
  document.getElementById('refDataSetVersion-'+id).addEventListener('change', function() {
       $.get('{{ url_for("projects.process_set_referencedataversion") }}', { 
            referencedataid: id,
            referencedataversionid:  $( '#refDataSetVersion-'+id).val(),
            processid: '{{ processid }}'
        }, function(data) {
        })
  });
}


function build_line( ref_data, versions ) {
    versionidstr = "Latest (dynamic)"
    versionid = -1
    console.log(JSON.stringify(ref_data))
    if( ref_data.referencedataversion != null ){
        versionidstr = ref_data.referencedata.version
        versionid    = ref_data.referencedataversionid
    }
     html = '<tr id="refdata-row-'+ref_data.id +'">'
     html += '  <th scope="row"></th>'
     html += '  <th>'+ref_data.label+'</th>'
     html += '  <th>' + ref_data.referencedata.name + '</th>'
     html += '  <td><select class="form-control form-control-sm" id="refDataSetVersion-' + ref_data.id + '">'
     html += '      <option value="-1">Latest (dynamic)</option>'
     for ( const v of versions ) {
        selected=""
        if (v.id == versionid ) {
           selected="selected"
        }
        html += '    <option value="'+ v.id +'"' + selected + '>'+ v.name +' ('+v.id+')</option>'
     }
     html += '      </select></td>'
     html += '  <td><button class="btn-danger" id="btn-delete-'+ ref_data.id +'"><i class="fas fa-trash"></i></button></td>'
     html += '</tr>'
     return html
}

function build_reference_data_table(reference_datas, ref_versions) {
    $('#refdata_table > tbody').empty()
    for ( ref_data of reference_datas ){
        let versions  = ref_versions[ref_data.referencedataid]
        $('#refdata_table > tbody:last-child').append( build_line( ref_data, versions ) )
        addEventDeleteBtn(ref_data.id)
        addEventChangeVersion(ref_data.id)
    }; 
}

$('document').ready(function(){
    reference_data_sets = {{reference_data_sets|tojson}}
    reference_datas_for_process = {{reference_data_for_process|tojson}}
    ref_versions = {{ref_versions|tojson}}
    for( ref of reference_data_sets ) {
        $('#refDataSetSelect').append( new Option(ref.name + '('+ref.id+')', ref.id ) ) 
    };

    build_reference_data_table(reference_datas_for_process, ref_versions)

    $('#refDataSetLabel').on('input', function() {
        $('#refDataSetSelect').removeClass('invisible')
    })

    $('#refDataSetVersionSelect').on('change', function() {
        $('#btnAddRefData').removeClass('invisible disabled')
    })


    $('#btnAddRefData').on('click', function() {
        $.get("{{ url_for('projects.process_add_referencedataversion') }}", {
            referencedataid: $('#refDataSetSelect').val(),
            referencedataversionid:  $('#refDataSetVersionSelect').val(),
            processid: '{{ processid }}',
            label: $('#refDataSetLabel').val(),
        }, function(refdata_conn) {
            $.get('{{ url_for("projects.referencedataversions") }}', { 
                referencedataid: refdata_conn.referencedata.id
            }, function( versions ) {
                $('#refdata_table > tbody:last-child').append( build_line( refdata_conn, versions ) )
                addEventChangeVersion(refdata_conn.id)
                addEventDeleteBtn( refdata_conn.id)
            })
        });

        $('#btnAddRefData').addClass('invisible disabled') 
        $('#refDataSetVersionSelect').addClass('invisible')
        $('#refDataSetVersionSelect').empty()
        $("#refDataSetSelect").prop("selectedIndex", 0 ) 
        $("#refDataSetSelect").addClass('invisible')
    }) 

    $('#refDataSetSelect').on('change', function() {
        $('#refDataSetVersionSelect').removeClass('invisible')
    
        $.get('{{ url_for("projects.referencedataversions") }}', { 
            referencedataid: this.value
        }, function(data) {
            o = new Option( " -- select a version id -- ", null, true, true )
            o.setAttribute("disabled", "disabled")
            $('#refDataSetVersionSelect').append( o )
            $('#refDataSetVersionSelect').append( new Option( "Latest (dynamic)", -1 ))
        for( version of data ) {
                $('#refDataSetVersionSelect').append( new Option(version.name + '('+version.id+')', version.id ) ) 
            };
        })
        
    })

});

/////////////////////////////////////////






</script>
