{% extends 'base2.html' %}
 
{% block heading %}
<H3><b>NGS Run overview</b></H3>
{% endblock %}

{% block content %}
<TABLE class="table table-striped table-hover table-sm">
    <thead class="thead-dark">
    <TR>
        <TH scope="col">Description</TH>
        <TH scope="col">Flowcell</TH>
        <TH scope="col">Data Collection</TH>

    </TR>
    </thead>
    <tbody>

{% for run in data %}
<tr>
<td>{{ run.description }}</td>
<td>{{ run.flowcell }}</td>
<td>{{ run.datacoll }}</td>
</tr>
{% endfor %}
</tbody>
{% endblock %}
