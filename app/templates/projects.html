{% extends 'base2.html' %}
  
{% block heading %}
{% endblock %}

{% block content %}
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-left">
<a class="navbar-brand" href="#">Projects overview</a>
</nav>
<div class="card border-primary mb-3">
    <div class="card-body">
<TABLE class="table table-striped table-hover table-sm">
<thead>
<TR>
<TH scope="col">Project Name</TH>
</TR>
</thead>
<tbody>
{% for project in projects %}
<tr>
<td width="20%">
<a href="{{ url_for('projects.show_projectdetails') }}?name={{ project }}">
{{ project }}
</td></tr>
{% endfor %}
</tbody>
</table>
</div>

<form class="form" action="update_project" method="post">
<input type="hidden" id="action" name="action" value="add_project">
<div class="form-group mx-sm-3 mb-2">
  <label for="newProject">Project Name</label>
  <input type="text" class="form-control" name="project" id="inputProject" placeholder="Project">
</div>
<div class="form-group mx-sm-3">
  <button type="submit" class="btn btn-primary">Add new project</button>
</div>
</form>
</div>

{% endblock %}
