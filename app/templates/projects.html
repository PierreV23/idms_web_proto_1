{% extends 'base2.html' %}
  
{% block heading %}
<H2>Projects overview</H2>
{% endblock %}

{% block content %}
<TABLE class="table table-striped table-hover table-sm">
<thead>
<TR>
<TH scope="col">Project Name</TH>
</TR>
</thead>
<tbody>
{% for project in projects %}
<tr>
<td width="20%">
<a href="{{ url_for('projects.show_projectdetails') }}?name={{ project }}">
{{ project }}
</td></tr>
{% endfor %}
</tbody>
</table>

{% endblock %}
