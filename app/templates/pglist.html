{% extends 'jobsmenu.html' %}

{% block meta %}
{% endblock %}

{% block heading %}
<h3>
    <div class="inline">Processgroup overview</div>
    <div class="float-right header-right">
        Last refresh: <div class="refresh-time">... loading ...</div>
    </div>
</h3>
{% endblock %}

{%block menuname %}
menuname='pglist'
{% endblock %}

{% block content %}
<div class="h-100">
    <script>
        $(document).ready(function () {
            $('[data-toggle="tooltip"]').tooltip();
        });

    </script>

    <table id="pgtable" 
      data-buttons-prefix="btn" 
      data-classes='table table-bordered table-hover table-striped'
      data-filter-control="true"
      data-detail-view='true' 
      data-id-field='processgroupid'
      data-page-list=[15,25,50,100] 
      data-page-size=15 data-pagination='true' 
      data-row-style="groupStyle"
      data-search="false" 
      data-url='{{ url_for("jobs.pglist", processgroupid=processgroupid) }}'
      data-side-pagination='server' 
      data-show-columns="true" 
      data-show-filter-control-switch="true"
      data-custom-sort="sorter" 
      data-sort-name="create_time" 
      data-sort-order="desc" 
      data-toggle="table"
      data-auto-refresh="true" 
      data-auto-refresh-interval=30 
      data-show-auto-refresh="false">
        <thead>
            <tr>
                {% for c in columns %}
                <th class="pgcolumn"
                    data-field="{{columns[c]['field']}}" 
                    data-align="left" 
                    data-sortable="{{columns[c]['sortable']}}"
                    data-visible="{{columns[c]['visible']}}" 
                    data-filter-control="{{columns[c]['filtercontrol']}}" 
                    {% if columns[c]['filtercontrol']=="select" %}
                      data-filter-data='url:{{ url_for("jobs.filterdata", field=columns[c]["field"], table="rivm_v_processgroups") }}'
                    {% endif %}>
                    {{columns[c]['title']}}
                </th>
                {% endfor %}
            </tr>
        </thead>
    </table>

    <script>
        $(function(){
            $table=$('#pgtable')
            $table.bootstrapTable('showAllColumns');
            all_columns = {{ columns.values()  | map(attribute='field') | list | safe }}
            visible_columns = {{ visible_columns | safe }};
            all_columns.forEach(element => {
                if (!visible_columns.includes(element)) {
                    $table.bootstrapTable('hideColumn', element)
                }
            })
        })


        $('table#pgtable').on('column-switch.bs.table', function (e, field, checked) {
            visible_fields = $("th.pgcolumn").map(function(){return $(this).data('field') ;}).get();
            $.post('{{ url_for("userinfo.usersetting") }}', {
                attr: 'processgroups::columns',
                value: JSON.stringify(visible_fields)
            })
        })

        openDetails = []

        $('table#pgtable').on('expand-row.bs.table', function (e, index, row, $detail) {
            openDetails.push(index)
            $.get('{{ url_for("jobs.pgjobs") }}?processgroupid=' + row['_processgroupid'], function (data) {
                $detail.html('<table></table>').find('table').bootstrapTable({
                    autoRefresh: true,
                    showAutoRefresh: false,
                    autoRefreshInterval: 30,
                    columns: data['columns'],
                    data: data['rows'],
                    rowStyle: 'rowStyle',
                    sortName: 'create_time',
                    sortOrder: 'desc',
                    customSort: 'sorter'
                });
                data['columns'].forEach(function (x, i) {
                    if (x['visible'] == 'false') {
                        $detail.find('table').bootstrapTable('hideColumn', x['field'])
                    }
                })
            })
        })

        $('table#pgtable').on('page-change.bs.table', function () {
            openDetails = []
        })

        $('table#pgtable').on('collapse-row.bs.table', function (e, index, row, $detail) {
            const index_index = openDetails.indexOf(index);
            openDetails.splice(index_index, 1)
        })

        $('table#pgtable').on('load-success.bs.table', function (e, index, row, $data) {
            openDetails.forEach(function (value) {
                $('table#pgtable').bootstrapTable('expandRow', value)
            })
            $.get('{{ url_for("jobs.jobs_refresh") }}', function(data) {
                $('.refresh-time').html(data);
            });
        })

        function sorter(field, sortOrder, data) {
            var order = sortOrder === 'desc' ? -1 : 1
            data.sort(function (a, b) {
                var aa = a['_' + field]
                var bb = b['_' + field]
                if (aa < bb) {
                    return order * -1
                }
                if (aa > bb) {
                    return order
                }
                return 0
            })
        }

        function groupStyle(row, index) {
            var styles = {
                'done': 'table-success',
                'error': 'table-danger',
                'active': 'table-info'
            };
            if (row['exit_code'] > 0) {
                return {
                    classes: 'table-danger'
                }
            }
            return {
                classes: styles[row['state']]
            }
        }

        function rowStyle(row, index) {
            var styles = {
                'done': 'table-success',
                'error': 'table-danger',
                'active': 'table-info'
            };
            if (row['state'] == 'done' && row['exit_code'] != 0) {
                return {
                    classes: 'table-danger'
                }
            }
            return {
                classes: styles[row['state']]
            }
        }

    </script>
    {% endblock %}
