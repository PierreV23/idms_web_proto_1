
<table id="version-table" class="table" 
    data-toggle="table" 
    data-striped="true" 
    data-pagination="true"
    data-pagination-use-intermediate="true"
    data-page-list="[10, 50, 100]"
    data-page-size="10"
    data-detail-view="true"
    data-detail-formatter="detailFormatter"
    data-filter-control="true"
    #data-height="500"
    data-icons-prefix="fa"
    data-show-button-icons="false"
    data-search="false" 
    data-unique-id="id" 
    data-buttons-prefix="btn-sm btn"
    data-side-pagination="client">
    <thead>
        <tr>
            <th data-field="version" data-align="left" data-sortable="true" data-filter-control="input">Version</th>
            <th data-field="creation_date" data-align="" data-sortable="true">Creation Date</th>
            <th data-field="version_name" data-align="" data-sortable="true">Version Name</th>
            <th data-field="dataset_id" data-align="left" data-sortable="false">Dataset Id</th-->
            <th data-field="irods_display_path" data-align="" data-sortable="false">Path</th>
        </tr>
    </thead>
</table>

<script>

function detailFormatter(index, row) {
    var html = []
    var meta = row["irods_metadata"]
    $.each(meta, function (key, value) {
      html.push('<p><b>' + key + ':</b> ' + value + '</p>')
    })
    return html.join('')
  }

  $('#version-table').bootstrapTable({
    data: {{data|safe}}
  });



  $(document).on('click', '.path-change', function () {
    collection = (this.nodeName == "g" ? this.id : $(this).data('path'));
    history.pushState({ "coll": collection }, 'Browse ' + collection, '/collbrowser?path=' + collection);
    $.post('{{ url_for("userinfo.usersetting") }}', {
      attr: 'path',
      value: collection
    })
    window.open( '/collbrowser?path='+collection, '_blank');
  });

</script>
