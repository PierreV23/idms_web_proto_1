{% extends 'base2.html' %}
  
{% block content %}

<script>

</script>
<div class="card border-primary mb-3">
    <div class="card card-header">
        <h2>Archive Issues<h2>
    </div>
    <div class="card card-body">
        <table class="table">
            <THEAD>
                <TR>
                    <TD>Collection</TD>
                    <TD>Status</TD>
                    <TD>Message</TD>
                    <TD>Actions</TD>
                </TR>
            </THEAD>
            {% for item in items %}
            <TR>
                <TD>{{ item['collection'].htmlstring | safe }}</TD>
                <TD>{{ item['status'] }}</TD>
                <TD>{{ item['statusmsg'] }}</TD>
                <TD>
                    <button class="button btn-primary archive-action" data-path='{{ item["collection"].value }}' data-action='clear_status'>Clear status</button>
                    {% if item["allow_remove"] is sameas True %}
                    <button class="button btn-danger archive-action" data-path='{{ item["collection"].value }}' data-action='remove_archive'>Remove Manifest & Archive</button>
                    {% endif %}
                </TD>
            </TR>
            {% endfor %}
        </table>
    </div>
</div>

<script>
$('.archive-action').on('click', function() {
   $.post("{{ url_for('admin.archive_action') }}", {
       collection: $(this).data("path"),
       action: $(this).data("action")
   }, function (data) {
        if (typeof data.message != 'undefined') {
            alert(data.message)
        }
        location.reload()
   })
})

</script>

{% endblock %}
