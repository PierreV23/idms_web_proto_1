{% extends 'base2.html' %}

{% block heading %}
<h3>Process details : <div class="activeproject" style="display:inline"></div>
</h3>
{% endblock %}

{%block menuname %}
menuname='projects'
{% endblock %}

{% block menuitems %}

<form class="form" action="{{ url_for('projects.update_projectsettings') }}" method="post">
  <div class="form-group">
    <label for="new_pname" class="col-form-label white">ADD NEW PROJECT</label>
    <INPUT TYPE="text" class="form-control menuexpand" id='new_pname' name="project">
    <INPUT TYPE="hidden" name="action" value="add_project">
    <button type=submit class="btn btn-primary">Add project</button>
  </div>
</form>

{% endblock %}

{% block content %}
<script>

$(document).on('click', '.projectname', function() {
  project=$(this).data('projectname');
  $('.projectname').removeClass('active')
  $('.processname').removeClass('active')
  $('.activeproject').html(project)
  $(this).addClass("active")
  $('#details').html('<center><IMG SRC="{{ url_for('static', filename='img/loading.gif') }}" width="30%"></IMG><center>')
  $.get('{{ url_for('projects.show_projectdetails') }}', {
    name: project,
    processgroup: "{{ processgroup }}"
  }, function(data) {
    $('#details').html(data);
    $("button[id='{{ pp }}-tab']").trigger('click')
  });
});

$(window).on('load', function() {
  $("li[data-projectname='{{ project }}']").trigger('click');
});

// Some functions for the processgroup graphs 

$(document).on('click', '#select_input_button', function(){
    if (mode != 'select_input') {
        mode = 'select_input';
        console.log('Mode: select_input')
    } else {
        mode = 'display'
    }
    
    load_pgpage();
})

</script>

<div class="selectgrid h-100">

  <div class="card selectlist">
    <div class="card-body nopadding scroll">
      <UL class="list-group">
        {% for project in projects | sort %}
          <li class="list-group-item projectname " data-projectname="{{ project }}">{{ project }}</LI>
        {% endfor %}
      </UL>      
    </div>
  </div>

  <div class="card selectdetail" id="details">

  </div>
</div>


{% endblock %}
