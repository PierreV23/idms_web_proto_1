<script>

processgroup = '{{ processgroup }}'

function load_pg() {
  $.get('{{ url_for('projects.processgroups') }}', {
    project: "{{ PD.name }}",
    group: processgroup
  }, function(data) {
     $('#processgroups').html(data);
     console.log('load the contents...')
     load_pgpage();
  });
}

function load_colls() {
  $.get('{{ url_for('projects.projectcolltable') }}', {
    project: "{{ PD.name }}"
  }, function(data) {
     $('#collections').html(data);
     console.log('load the collection list ...')
  });
}

$('.nav2').on('shown.bs.tab', function(event){
  target = event.target.getAttribute('href')
  activetab = target
  if (target == "#processgroups") {
    load_pg();
  }
  if (target == "#collections") {
    load_colls();
  }
  console.log(target)
})

$(document).on('click', '.path-change', function () {
    collection = $(this).data('path');
    if (typeof collection == 'undefined') {
      collection = $(this).attr('id')
    }
    window.location.replace("{{ url_for('collbrowser.collbrowser') }}?path=" + encodeURIComponent(collection));
  });

function update_process(sourceElem, destElem) {
    $.post("{{ url_for('projects.get_process') }}",
    { project: $(sourceElem+" option:selected").text() },
        function(response) { 
            select = $(destElem) 
            if(select.prop) {
                var options = select.prop('options');
            }
            else {
                var options = select.attr('options');
            }
            $('option', select).remove();
            $.each(response, function(index, val) {
                options[options.length] = new Option(val, val);
            });
        }    
    );    
}

function deleteContact( project_id, contact_id ) {
   console.log( `project_id: ${project_id}, contact_id: ${contact_id}` )
   var data = {
      "project_id": `${project_id}`,
      "contact_id": `${contact_id}`
   }
   $.post( "{{ url_for('projects.delete_contact') }}",
           JSON.stringify(data),
           function( data, status ) {
              if( data['success'] ) {
                $( '#contacts-alert' ).empty()
                $( '#contacts-alert' ).hide()
                $( `#row-contact-${contact_id}` ).remove()
              }
              else {
                var msg = data['msg']
                $( '#contacts-alert' ).html(msg)
                $( '#contacts-alert' ).show()
              }
           },
           'json' )
}

function updateContact( project_id, contact_id, contact ) {
    console.log( `project_id: ${project_id}, contact_id: ${contact_id}` )
    var data = {
      "project_id": `${project_id}`,
      "contact_id": `${contact_id}`,
      "contact": contact
   }
    $.post( "{{ url_for('projects.update_contact') }}",
           JSON.stringify(data),
           function( data, status ) {
              if( data['success'] ) {
                $( '#contacts-alert' ).empty()
                $( '#contacts-alert' ).hide()
              }
              else {
                var msg = data['msg']
                var contact = data['contact']
                $( '#contacts-alert' ).html(msg)
                $( '#contacts-alert' ).show()
                //make sure the contact still shows the old state
                $( `#contact-primary-${contact.id}`).prop('checked', true).change() 
              }
           },
           'json' )
}

function createContact( project_id, contact ) {
    //console.log( `project_id: ${project_id}` )
    var data = {
      "project_id": `${project_id}`,
      "contact": contact
   }
    $.post( "{{ url_for('projects.create_contact') }}",
           JSON.stringify(data),
           function( data, status ) {
              if( data['success'] ) {
                $( '#contacts-alert' ).empty()
                $( '#contacts-alert' ).hide()
                $( '#new_contact_name' ).val("")
                $( '#new_contact_email' ).val("")
                createContactRow( data.contact )
              }
              else {
                var msg = data['msg']
                $( '#contacts-alert' ).html(msg)
                $( '#contacts-alert' ).show()
              }
           },
           'json' )
}

function saveNewContact() {
   var name = $( '#new_contact_name' ).val()
   var email =$( '#new_contact_email' ).val()
   var primary = 0
   if( $( '#new_contact_primary').prop("checked") == true) {
        primary = 1
   }
   var data = { "name": name, "email": email, "primary" : primary }
      createContact( "{{PD.name}}", data );
}

function createContactRow( contact ) {
  var checked = ""
       if(contact.primary == 1) {
         checked = "checked"
       }
       var ct = $( "#contact-table" );
       ct.append( `<tr id="row-contact-${contact.id}">
          <td>${contact.name}</td>
          <td>${contact.email}</td>
          <td>
            <div class="custom-control custom-switch">
              <input type="checkbox" class="custom-control-input toggle-primary-contact" id="contact-primary-${contact.id}"  data-contact_id="${contact.id}" ${checked}>
              <label class="custom-control-label" for="contact-primary-${contact.id}">&nbsp;</label>
            </div>
          </td>
          <td><button class="btn btn-danger del-contact" data-contact_id="${contact.id}"><i class="fa fa-trash" aria-hidden="true"></i></button></td>
        </tr>` )
}

</script>

<script>

  function load_users() {
    usertype = $("ul#projecttabs li button.active").data('usertype')
    $.get("{{ url_for('projects.usermanager') }}", {
      object: '{{ PD.name }}',
      objecttype: 'projects',
      usertype: usertype
    }, function(data) {
      $('#' + usertype).html(data);
    });
  }

  $('.usermanager').on('shown.bs.tab', function (event) {
    load_users();
  });


  $( ".toggle_next" ).each(function() {
    var check=$(this).prop('checked')
    var proc=$(this).data('process')
    $("[id^=nextpro][data-process=" + proc + "]").prop('disabled', function(){
        return !check
    })
  });

  $( "#contacts-alert" ).hide()
  var ct = $( "#contact-table" );
  //ct.empty();
  // TODO: I don't know why the correct JSON from the API (double-quotes around key/value) is here 
  //       with single ticks around key/value. THIS IS NOT PRODUCTION READY!
  var pd_contacts = JSON.parse( "{{ PD.contacts|safe }}".replace(/'/g, '"') )
  pd_contacts.forEach( function(contact, index){
    createContactRow( contact )
  })

  $( ".del-contact" ).on( 'click', function(event){
    var contact_id = $( this ).attr("data-contact_id");
    deleteContact( "{{PD.name}}", contact_id );
  })

  $( ".toggle-primary-contact" ).on( 'click', function(event){
    var primary = 0
    if( $(this).prop("checked") == true) {
      primary = 1
    }

    var contact_id = $( this ).attr("data-contact_id");
    var data = { "primary" : primary }
    updateContact( "{{PD.name}}", contact_id, data );
  });


  function omit_check() {
    console.log("Check")
    if ($('input[name="do_bringonline"]').is(":checked")) {
      $('input[name="do_staging').prop('disabled', false)
    } else {
      $('input[name="do_staging').prop('disabled', true).prop('checked', false)
    }
  }

  $('input[name="do_bringonline"]').on('click', omit_check );
  $('document').ready( omit_check )


</script>
