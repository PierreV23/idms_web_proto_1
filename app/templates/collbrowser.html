{% extends 'base2.html' %}

{% block heading %}
<H3><b>Collection browser:</b> <span id="path_title">{{ path_title | safe }}</span></H3>
{% endblock %}

{% block content %}

<script>

  var collection = "{{ path }}";
  var sortkey = "";
  var reverse = "";
  var activetab = "Files";
  var selected_object = "";

  function fillModal(path, name) {
    var ModalHeader = document.getElementById("DocTitle")
    ModalHeader.innerHTML = name
    var modalEmbed = document.getElementById("DocText")
    newEmbed = modalEmbed.cloneNode(true)
    source = "{{ url_for('docviewer.serve_object') }}?path=" + path
    newEmbed.setAttribute('src', source)
    modalEmbed.parentNode.replaceChild(newEmbed, modalEmbed)
  }

  function avu_table() {
    if ($("#metatoggle").text() == 'Formatted') {
      d1 = 'table-cell';
      d2 = 'none'
      text = 'Unformatted'
    } else {
      d2 = 'table-cell';
      d1 = 'none'
      text = 'Formatted'
    }
    $('.rawvalues').css('display', d1);
    $('.formatvalues').css('display', d2);
    $('#metatoggle').html(text)
  }

  function build_title() {
    path_elem = collection.split('/')
    var i;
    title = ''
    path = ''
    for (i = 1; i < path_elem.length; i++) {
      path += '/' + path_elem[i];
      title += '/' + '<span class="path-change" data-path="' +
        path + '">' + path_elem[i] + '</span>'
    }
    $("#path_title").html(title)
  }

  function load_graph() {
    $.get('{{ url_for('collbrowser.generate_graph') }}', {
      path: collection
    }, function (data) {
      $('#graphimg').html(data)
     // $('#graphdiv').height('150')
      console.log($('#graphdiv').height())
      $('#graphdiv').scrollTop($('.center-coll').offset().top + $('#graphdiv').scrollTop() - $('#graphdiv').offset().top - $('#graphdiv').height()/2);
      let w = $("#graphimg").width().toString() + 'pt'
      $('svg').width(w)
    });
  }

  function load_meta() {
    $.get('{{ url_for('collbrowser.coll_meta') }}', {
      path: collection,
      object: selected_object
    }, function (data) {
      $('#meta-card').html(data)
    });
  }


  function load_list(new_path) {
    $.get('{{ url_for('collbrowser.collist') }}', {
      path: collection,
      sortkey: sortkey,
      reverse: reverse,
      new_path: new_path,
      btn_download: true
    }, function (data) {
      $('#collapse-contents').html(data)
    });
  }


  function load_tree() {
    $.get('{{ url_for('collbrowser.colltree') }}', {
      active: collection
    }, function (data) {
      $('#treeview').html(data)
    });
  }

  function tree_active() {
    $('.path-active').removeClass('path-active');
    $(".tree-label[data-path='" + collection + "']").addClass('path-active');
  }

  function load_actions() {
    //path_elem = collection.split('/')
    //current_col_name = path_elem[-1]

    $.get('{{ url_for('collbrowser.coll_actions') }}', {
      path: collection
    }, function (data) {
      $('#collapse-actions').html(data)
      $('#collection').val(collection)
      $('.nav-pills button[href="' + activetab + '"]').tab('show')
      //$('.nav-tabs a:last').tab('show')
    });
  }

  function set_path() {
    load_list(true);
    load_graph();
    load_meta();
    build_title();
    tree_active();
    load_actions();
  }

  $(document).on('click', '.sort-change', function () {
    console.log('change')
    sortkey = $(this).data('key');
    reverse = $(this).data('dir');
    load_list(false);
  });

  $(document).on('click', '.path-change', function () {
    history.pushState({ "coll": collection }, 'Browse ' + collection, '/collbrowser?path=' + collection);
    collection = $(this).data('path');
    if (typeof collection == 'undefined') {
      collection = $(this).attr('id')
    }
    set_path();
  });

  $(window).on('load', function () {
    set_path();
    load_tree();
  });

  window.onpopstate = function (event) {
    collection = event.state.coll;
    set_path();
  }

</script>

<div class="wrapper">
  <nav id="sidebar">
    <div class="card border-primary mb-3 h100">
      <div class="card-header sidebar-header list-pointer">
        <b>Collection tree</b>
      </div>
      <div class="card card-body scroll small-font">
        <div id="treeview">
        </div>
      </div>
    </div>

  </nav>

  <div id="content">

    <script>
      $('#sidebar').on('click', '.list-close', function () {
        $(this).addClass('caret-down list-open');
        $(this).removeClass('list-close');
        myid = $(this).attr('id')
        $.get('{{ url_for('collbrowser.colltree') }}', {
          active: '{{ path }}',
          root: $(this).data('path')
        }, function (data) {
          $('#' + $.escapeSelector(myid)).parent().after(data);
        });
      });

      $('#sidebar').on('click', '.list-open', function () {
        $(this).removeClass('caret-down list-open');
        $(this).addClass('list-close');
        sublistid = $(this).attr('id').substr(2);
        $('#' + $.escapeSelector(sublistid)).html('');
      });
    </script>

    <div class="container-wide">

      <div class="row">
        <div class="col-md-8">

          <div id="data_map"></div>

          <div class="card border-primary mb-3 graph-height ">
            <div class="card-header myheader">
              Data graph
            </div>
            <div class="scroll card-body h100 nopadding" id="graphdiv"> 
              <div id="graphimg">
              </div>
            </div>
          </div>

        </div>

        <div class="col-md-4">
          <div id="collapse-actions">
          </div>
        </div>

      </div>
      <!--row-->

      <div class="row">
        <div class="col-md-8">
          <div class="card border-primary mb-3">
            <div class="card-header myheader">
              Collection contents
            </div>
            <div class="card card-body coll-content" id="collapse-contents">
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card border-primary mb-3" id="meta-card">

          </div>
        </div>

      </div>
      <!--row-->

    </div> <!-- container-wide-->

    <!-- Document viewer modal dialog -->
    <div class="modal modal-tall" id="myOutput" role="dialog">
      <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content ">
          <div class="modal-header">
            <!--            <button type="button" class="close" data-dismiss="modal">&times;</button> -->
            <h5 class="modal-title" id="DocTitle">Modal Header</h5>
            <button type="button" class="btn btn-default btn-primary btn-sm" data-dismiss="modal">Close</button>
          </div>
          <div class="modal-body" id="mBody">
            <embed src="" width="100%" height="100%" id="DocText">
          </div>
        </div>
      </div>
    </div>

    <!-- Upload modal modal dialog -->
    <div class="modal" id="upload" role="dialog">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="DocTitle">Modal Header</h5>
            <button type="button" class="btn btn-default btn-primary btn-sm" data-dismiss="modal">Close</button>
          </div>
          <div class="modal-body" id="mBody">
            <form action="{{ url_for('collbrowser.upload_file')}}" method="POST" enctype="multipart/form-data">
              <div class="form-group">
                <input type="hidden" id="collection" name="collection" value="{{ path }}">
              </div>
              <div class="form-group">
                <input type="file" class="form-control" name="file" />
              </div>
              <div class="form-group">
                <button type="submit" class="btn btn-primary">Upload</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div> <!-- content -->


  {% endblock %}
