{% extends 'base2.html' %}
 
{% block heading %}
<H3><b>Collection browser:</b> <span id="path_title">{{ path_title | safe }}</span></H3>
{% endblock %}

{% block content %}

<script>

collection="{{ path }}"

function fillModal(path, name) {
    var ModalHeader =  document.getElementById("DocTitle")
    DocTitle.innerHTML = name 
    var modalEmbed =  document.getElementById("DocText")
    newEmbed = modalEmbed.cloneNode(true)
    source = "{{ url_for('docviewer.serve_object') }}?path=" + path
    newEmbed.setAttribute('src', source)
    modalEmbed.parentNode.replaceChild(newEmbed, modalEmbed)
}  

function avu_table() {
    if ($("#metatoggle").text() == 'Formatted') {
        d1 = 'table-cell';
        d2 = 'none'
        text = 'Unformatted'
    } else {
        d2 = 'table-cell';
        d1 = 'none'    
        text = 'Formatted'
    }
    $('.rawvalues').css('display', d1);
    $('.formatvalues').css('display', d2);
    $('#metatoggle').html(text)
}

function build_title() {
  path_elem = collection.split('/')
  var i;
  title = ''
  path = ''
  for (i = 1; i < path_elem.length; i++) {
    path += '/' + path_elem[i];
    title += '/' + '<span class="path-change" data-path="' + 
            path + '">' + path_elem[i] + '</span>' 
  } 
  $("#path_title").html(title)
}

function load_graph() {
  $.get('{{ url_for('collbrowser.generate_graph') }}', {
    path: collection
  }, function(data) {
     $('#data_map').html(data.map)
     $('#graphimg').attr('src', 'data:image/png;base64,' + data.graph)
  });
}

function load_meta() {
  $.get('{{ url_for('collbrowser.coll_meta') }}', {
    path: collection
  }, function(data) {
    $('#collapse-meta').html(data)
  });
}

function load_list() {
  $.get('{{ url_for('collbrowser.collist') }}', {
    path: collection
  }, function(data) {
    $('#collapse-contents').html(data)
  });
}

function load_tree() {
  $.get('{{ url_for('collbrowser.colltree') }}', {
    active: collection
  }, function(data) {
     $('#treeview').html(data)
  });
}

function tree_active() {
  $('.path-active').removeClass('path-active');
  $(".tree-label[data-path='" + collection +"']").addClass('path-active');
}

function set_path() {
  load_list();
  load_graph();
  load_meta();
  build_title();
  tree_active();
}

$(document).on('click', '.path-change', function() {
  collection=$(this).data('path');
  set_path();
});

$(window).on('load', function() {
  set_path();
  load_tree();
});


</script>

<div class="wrapper">
<nav id="sidebar">
<div class="card border-primary mb-3">
<div class="card-header sidebar-header list-pointer">
<b>Collection tree</b>
</div>
<div class="card card-body scroll small-font">
<div id="treeview">
</div>
</div>
</div>
<div class="card border-primary mb-3">

</div>
</nav>

<div id="content">

<script>
$('#sidebar').on('click', '.list-close', function() {
  $(this).addClass('caret-down list-open');
  $(this).removeClass('list-close');
  myid=$(this).attr('id')
  $.get('{{ url_for('collbrowser.colltree') }}', {
    active: '{{ path }}',
    root: $(this).data('path')
  }, function(data) {
    $('#' + $.escapeSelector(myid)).parent().after(data);
  });
});

$('#sidebar').on('click', '.list-open', function() {
  $(this).removeClass('caret-down list-open');
  $(this).addClass('list-close');
  sublistid = $(this).attr('id').substr(2);
  $('#' + $.escapeSelector(sublistid)).html('');
});
</script>

<div class="card border-primary mb-3">
    <div class="card-header">
        <a class="btn btn-outline-secondary text-left" data-toggle="collapse" href="#collapse-upload" role="button" aria-expanded="false" aria-controls="collapse-upload">
        Upload
        </a>
    </div>
    <div class="card card-body">
        <div class="collapse" id="collapse-upload">
            <form action = "{{ url_for('collbrowser.upload_file')}}" method = "POST" enctype = "multipart/form-data">
                <div class="form-group">  
                    <input type="hidden" id="collection" name="collection" value ="{{ path }}">
                </div>
                <div class="form-group">  
                    <input type = "file" class="form-control" name = "file" />
                </div>  
                <div class="form-group">  
                    <button type="submit" class="btn btn-primary">Upload</button>
                </div>  
            </form>
        </div>
    </div>
</div>

<div class="card border-primary mb-3">
    <div class="card-header">
        <a class="btn btn-outline-secondary text-left" data-toggle="collapse" href="#collapse-graph" role="button" aria-expanded="false" aria-controls="collapse-graph">
        Data graph
        </a>
    </div>
    <div class="card card-body">
       <div class="collapse show" id="collapse-graph">
          <img src="" id="graphimg" usemap="#datagraph" />
       </div>
    </div>
</div>

<div id="data_map"></div>

<div class="card border-primary mb-3">
    <div class="card-header">
        <a class="btn btn-outline-secondary text-left" data-toggle="collapse" href="#collapse-meta" role="button" aria-expanded="false" aria-controls="collapse-meta">
        Collection metadata
        </a>
        <a class="btn btn-outline-secondary text-left float-right" id="metatoggle" onclick='avu_table()'" role="button" >Formatted</a>
    </div>
    <div class="card card-body" >
        <div class="collapse" id="collapse-meta">

        </div>
    </div>
</div>


<div class="card border-primary mb-3">
   <div class="card-header">
      <a class="btn btn-outline-secondary text-left" data-toggle="collapse" href="#collapse-contents" role="button" aria-expanded="false" aria-controls="collapse-contents">
        Collection contents
      </a>
   </div>
   <div class="card card-body">
      <div class="collapse show" id="collapse-contents">

       </div>
    </div>   
</div>

<!-- Document viewer modal dialog -->
<div class="modal modal-tall" id="myOutput" role="dialog" >
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content " >
            <div class="modal-header">
<!--            <button type="button" class="close" data-dismiss="modal">&times;</button> -->
                <h5 class="modal-title" id="DocTitle">Modal Header</h5>
                <button type="button" class="btn btn-default btn-primary btn-sm" data-dismiss="modal">Close</button>
            </div>
            <div class="modal-body" id="mBody">
                <embed src="" width="100%" height="100%" id ="DocText">
            </div>
        </div>
    </div>
</div>



</div>

{% endblock %}
