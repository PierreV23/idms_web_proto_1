name: myflask
channels:
  - conda-forge
dependencies:
  - apscheduler
  - flask
  - git
  - graphviz
  - jsonschema
  - marshmallow
  - marshmallow-sqlalchemy
  - openssl
  - pip
  - pycryptodome
  - python<3.13
  - python-dateutil
  - pyyaml
  - requests
  - flask-caching
  - flask-login
  - flask-marshmallow
  - flask-migrate
  - flask-sqlalchemy
  - flask-script
  - flask-session
  - sqlalchemy<2.0.0
  - sqlite
  - psycopg2
  - uwsgi
  - werkzeug
  - pip:
      - markdown
      - randomname
      - python-irodsclient==3.2.0
      - redis
      - graphviz
      - jsonschema
      - irods_avu_json
      #add extra package repositories for packages hosten on gitlab
      - "--extra-index-url https://gitlab.rivm.nl/api/v4/projects/4682/packages/pypi/simple"
      # iDMS_common_irods
      #- "--extra-index-url https://gitlab.rivm.nl/api/v4/projects/4656/packages/pypi/simple"
      - idms-common-irods>=0.0.8
      #- git+https://gitlab.rivm.nl/bioinformatics/idms_common_irods.git@evw_better_session_handling
      # iDMS_common_filesys
      #- "--extra-index-url https://gitlab.rivm.nl/api/v4/projects/4655/packages/pypi/simple"
      - idms-common-filesys>=0.0.3
      # iDMS_common_constants
      #- "--extra-index-url https://gitlab.rivm.nl/api/v4/projects/4654/packages/pypi/simple"
      - idms-common-constants>=0.0.5
      # During development it can be useful to have the packages editable and locally:
      # - "-e ../../idms_common/packages/irods"   #only if the other repo is locally checked out at exactly that path....
      # - "-e ../../idms_common/packages/filesys"
