version: '3'
services:

  # note; symlink docker-compose.development.yml to
  # docker-compose.override.yml when developing.

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    entrypoint: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - ngsweb_network
    ports:
      - "6379:6379"
    volumes:
      - /etc/localtime:/etc/localtime:ro

  ngsweb:
    build: .
    image: ngsweb
    environment:
      TZ: Europe/Amsterdam
      FLASK_APP: 'app'
      PORT: '8080'
    depends_on:
      - redis
    entrypoint: /bin/bash -c ". /venv/bin/activate && uwsgi --ini ngsweb.ini --http 0.0.0.0:3456"
    ports:
      - 3333:3456
    volumes:
      - ./instance/:/ngsweb/instance/
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
        tag: "ngsweb-docker"
        syslog-facility: "local6"
    networks:
      - ngsweb_network

networks:
  ngsweb_network:
    driver: bridge