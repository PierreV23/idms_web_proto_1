{% extends 'base2.html' %}

  
{% block header %}
<h2>{% block title %}Datasets{% endblock %}</h2>
{% endblock %}

{% block content %}
<H2>Dataset List</H2>
<TABLE class="table table-striped table-hover table-sm">
<TR>
<TH>Project</TH>
<TH>Dataset name</TH>
</TR>
{% for entry in datasets %}
   <td>{{ entry.projectID}}
   </td>
   <td>
   <a href="/datasetdetails?path={{ entry.name }}">
   {{ entry.name }}
   </a>
   </TD>
</TR>
{% endfor %}
 </TABLE>
{% endblock %}
