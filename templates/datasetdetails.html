{% extends 'base2.html' %}
  
{% block heading %}
<H2>Dataset details for {{ details.name }} </H2>
{% endblock %}

{% block content %}

<!-- PROJECT SETTINGS --!>
<div class="card card-body">
<H2>Dataset details</H2>
<TABLE class="table table-striped table-hover table-sm" >
<thead>
<TR>
</TR>
</thead>
<tbody>
<tr><td>Project ID</td>
<td><a href="/projectdetails?name={{details.projectID}}">
{{details.projectID}}</a></td>
</tr>
</tbody>
</table>
</div>


<!-- PROJECT GROUPS --!>
<div class="card card-body">
<H2>Related output collections groups</H2>
<TABLE class="table table-striped table-hover table-sm" >
<thead>
<TR>
<TH scope="col">Name</TH>
</TR>
</thead>
<tbody>
{% for coll in details.related_colls %}
<tr>
<td>
<a href="/datasetdetails?path={{coll}}">
{{ coll }}
</a>
</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>


{% endblock %}
