{% extends 'base2.html' %}
 
{% block heading %}
Collection browser : {{ path }}
{% endblock %}

{% block content %}

<a class="btn-btn-primary" href="/collbrowser?action=up&path={{ path }} role="button">UP</a>

<table class="table">
<thead>
<tr>
<th>Name</th>
<th>Size</th>
</tr>
</thead>
<tbody>

{% for entry in cols %}
<tr><td>
<a href="/collbrowser?path={{ entry.path }}">{{ entry.name }}</a>
</td></tr>
{% endfor %}

{% for entry in objs %}
<tr><td>
<a href="/docviewer?path={{entry.path}}">{{ entry.name }}</a>
</td>
<td>
{{ entry.size}}
</td></tr>
{% endfor %}
</tbody>
</table>

{% endblock %}
