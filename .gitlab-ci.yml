stages:
  - deploy

deploy_minilims:
  stage: deploy
  script:
  - cp -r ${CI_PROJECT_DIR}/* /opt/ngsweb
  - sudo /bin/systemctl restart ngsweb.service
  only:
    - minilims_creators
  tags:
    - test2
    

deploy_test:
  stage: deploy
  script:
  - cp -r ${CI_PROJECT_DIR}/* /opt/ngsweb
  - sudo /bin/systemctl restart ngsweb.service
  only:
    - master
  tags:
    - test

deploy_production:
  stage: deploy
  script:
  - cp -r ${CI_PROJECT_DIR}/* /opt/ngsweb
  - sudo /bin/systemctl restart ngsweb.service
  only:
    - release
  tags:
    - prod
