stages:
  - deploy

variables:
  ASSETS_TOKEN: "glpat-vbRwqqXN0DO5wAV8ecT67G86MQp1OjE4agk.01.0z0wsyla2"
  ASSETS_REPO_URL: "https://${ASSETS_TOKEN}@gitlab.rivm.nl/bioinformatics/ngsweb_rivm_assets.git"
  #ASSETS_REPO_URL: git@gitlab.rivm.nl:bioinformatics/ngsweb_rivm_assets.git

deploy_minilims:
  stage: deploy
  script:
  - sudo cp -r ${CI_PROJECT_DIR}/. /opt/ngsweb
  - sudo /bin/systemctl restart ngsweb.service
  only:
    - minilims_creators
  tags:
    - test2

# There is currently no straightforward way to run a ci job on all registered runners
# We use the 'parallel' option, but the number of servers in an environment has to be configured manually.

deploy_test:
  stage: deploy
  script:
  - git clone $ASSETS_REPO_URL /tmp/temp_branding
  - sudo cp -r ${CI_PROJECT_DIR}/. /opt/ngsweb
  - cp -rf /tmp/temp_branding/* ${CI_PROJECT_DIR}/app/
  - rm -rf /tmp/temp_branding
  - sudo /bin/systemctl restart ngsweb.service
  only:
    refs:
      - web
  tags:
    - test

deploy_acc:
  stage: deploy
  script:
  - sudo cp -r ${CI_PROJECT_DIR}/. /opt/ngsweb
  - sudo /bin/systemctl restart ngsweb.service
  only:
    - master
  tags:
    - acc

deploy_production:
  stage: deploy
  script:
  - sudo cp -r ${CI_PROJECT_DIR}/. /opt/ngsweb
  - sudo /bin/systemctl restart ngsweb.service
  only:
    - release
  tags:
    - prod
